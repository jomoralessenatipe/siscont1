<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Básico</title>
</head>
<body>
    <h2>Ventana de Identificación</h2>
    <form action="LoginJpaServlet" method="POST">
        <label for="txtUsuario">Usuario:</label>
        <input type="text" id="txtUsuario" name="txtUsuario" required><br><br>
        
        <label for="txtPassword">Contraseña:</label>
        <input type="password" id="txtPassword" name="txtPassword" required><br><br>
        
        <input type="submit" value="Ingresar">
    </form>
</body>
</html>
